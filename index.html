"RAM Kademe Farkı|NECATİCAN YAVUZ|2 / F|989|YAŞAM DEMİRCİOĞLU||Dil ve Konuşma Güçlüğü",
"RAM Kademe Farkı|HAMZA DORUK DEMİR|3 / D|116|SİNEM DEMİR TEK||Hafif Düzeyde Otizm Spektrum Bozukluğu"];

var S=RAW.map(function(r,i){var p=r.split("|");return{id:"s"+(i+1),grp:p[0],name:p[1],cls:p[2],no:p[3],t:p[4],st:p[5],dx:p[6]||""}});
var TEACHERS=[];S.forEach(function(s){if(TEACHERS.indexOf(s.t)<0)TEACHERS.push(s.t)});TEACHERS.sort(function(a,b){return a.localeCompare(b,"tr")});
var CLASSES=[];S.forEach(function(s){if(CLASSES.indexOf(s.cls)<0)CLASSES.push(s.cls)});CLASSES.sort(function(a,b){return a.localeCompare(b,"tr",{numeric:true})});

// ---- DURUM ----
var me=null, admin=false, meetings={}, flash=null, rowErr={}, filterT="", tab=1;
var FORMS = {}, NEED3 = {}, MEM = {}, editM = null, view = null;
var app=document.getElementById("app");

// ---- BULUT ----
database.ref('meetings').on('value', function(snap){
  meetings = snap.val() || {};
  softRender();
});
database.ref('need3').on('value', function(snap){ NEED3 = snap.val() || {}; softRender(); });
database.ref('members').on('value', function(snap){ MEM = snap.val() || {}; softRender(); });
function softRender(){var ae=document.activeElement,mf=document.getElementById('mf');if(!view && !(ae && ae.type==='date') && !(mf && mf.contains(ae))) render()}   // takvim açıkken yeniden çizme
database.ref('forms').on('value', function(snap){
  if(!view) FORMS = snap.val() || {};   // form açıkken yazılan metni ezme
});

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function today(){return iso(new Date())}
function fmt(d){if(!d) return ""; var x=new Date(d+"T12:00:00");return x.toLocaleDateString("tr-TR",{day:"2-digit",month:"2-digit",year:"numeric"})+" "+x.toLocaleDateString("tr-TR",{weekday:"long"})}
function dmy(d,sep){return d?d.split("-").reverse().join(sep||"."):".../.../...."}
function countOn(d,except){var n=0;for(var k in meetings){if(meetings[k]&&meetings[k].date===d&&k!==except)n++}return n}
function okDay(d){var w=new Date(d+"T12:00:00").getDay();return!(w===6||w===0||HOL[d])}
function baseOf(k){return k.replace(/_[23]$/,'')}
function numOf(k){var m=/_([23])$/.exec(k);return m?+m[1]:1}
function addMonth(d){var x=new Date(d+"T12:00:00"),g=x.getDate();x.setMonth(x.getMonth()+1);if(x.getDate()!==g)x.setDate(0);return iso(x)}
function addDays(d,n){var x=new Date(d+"T12:00:00");x.setDate(x.getDate()+n);return iso(x)}

function check(d,sid){
  if(!d) return null;
  var w=new Date(d+"T12:00:00").getDay();
  if(d < "2026-09-01" || d > LAST_DAY) return "Seçilen tarih eğitim öğretim yılı dışında ("+fmt(LAST_DAY)+" son gün).";
  if(w===6||w===0) return fmt(d)+" hafta sonuna denk geliyor. Lütfen bir hafta içi gün seçin.";
  if(HOL[d]) return fmt(d)+" tatil günü ("+HOL[d]+"). Lütfen başka bir gün seçin.";
  if(countOn(d,sid)>=MAX_PER_DAY) return fmt(d)+" günü için "+MAX_PER_DAY+" toplantı kontenjanı dolu. Lütfen başka bir gün seçin.";
  return null;
}

function save(sid,d){
  if(!d){clearDate(sid);return}
  var base=baseOf(sid),n=numOf(sid),m1=meetings[base],m2=meetings[base+"_2"];
  var s=S.filter(function(x){return x.id===base})[0];
  var err=check(d,sid);
  if(!err&&n===2){
    if(!m1)err="Önce 1. toplantı tarihini girin.";
    else if(d<SEC_START||d>SEC_END)err="2. toplantı, 2. dönem başlangıcından ("+fmt(SEC_START)+") itibaren bir ay içinde, en geç "+fmt(SEC_END)+" tarihine kadar yapılmalı.";
    else if(d<addDays(m1.date,MIN_GAP))err="2. toplantı, 1. toplantıdan en az "+MIN_GAP+" gün sonra olmalı.";
  }
  if(!err&&n===3){
    if(!m2)err="Önce 2. toplantı tarihini girin.";
    else if(d<addMonth(m2.date))err="3. toplantı, 2. toplantıdan en az 1 ay sonra ("+fmt(addMonth(m2.date))+" veya sonrası) olmalı.";
  }
  if(err){rowErr[sid]=err;flash={c:"er",t:s.name+": "+err};render();return}
  delete rowErr[sid];
  flash={c:"ok",t:s.name+" için BEP "+n+". birim toplantısı "+fmt(d)+" olarak kaydedildi."};
  database.ref('meetings/'+sid).set({sid:sid,date:d,teacher:me,ts:Date.now()})
  .catch(function(){flash={c:"er",t:"Bulut veri tabanına kayıt yapılamadı."};render()});
}

function clearDate(sid){
  delete rowErr[sid];flash=null;
  var b=baseOf(sid),n=numOf(sid),u={};
  u['meetings/'+sid]=null;
  if(n===1){u['meetings/'+b+'_2']=null;u['meetings/'+b+'_3']=null;u['need3/'+b]=null}
  if(n===2)u['meetings/'+b+'_3']=null;
  database.ref().update(u);
}

function toggle3(id,on){
  flash=null;delete rowErr[id+"_3"];
  var u={};u['need3/'+id]=on?true:null;
  if(!on)u['meetings/'+id+'_3']=null;
  database.ref().update(u);
}

function autoAssign2(){
  var need=S.filter(function(s){return(admin||s.t===me)&&meetings[s.id]&&!meetings[s.id+"_2"]&&!s.st});
  need.sort(function(a,b){var x=meetings[a.id].date,y=meetings[b.id].date;return x<y?-1:x>y?1:(+a.no)-(+b.no)});
  var miss=S.filter(function(s){return(admin||s.t===me)&&!meetings[s.id]&&!s.st}).length;
  if(!need.length){flash={c:"wa",t:"Otomatik atanacak öğrenci yok."+(miss?" 1. toplantı tarihi girilmemiş "+miss+" öğrenci var; önce 1. toplantıyı girin.":"")};render();return}
  var win=[];for(var d=SEC_START;d<=SEC_END;d=addDays(d,1))if(okDay(d)&&d>=today())win.push(d);
  var tmp=Object.assign({}, meetings);
  function cnt(x){var n=0;for(var k in tmp)if(tmp[k]&&tmp[k].date===x)n++;return n}
  var soft=Math.max(1,Math.ceil(need.length/Math.max(win.length,1))),out=[],fail=[];
  need.forEach(function(s,i){
    var min=addDays(tmp[s.id].date,MIN_GAP),c=win.filter(function(x){return x>=min});
    var t=Math.floor(i*c.length/need.length),pick=null;
    for(var lim=soft;lim<=MAX_PER_DAY&&!pick;lim++){for(var j=0;j<c.length;j++){var dd=c[(t+j)%c.length];if(cnt(dd)<lim){pick=dd;break}}}
    if(pick){var rec={sid:s.id+"_2",date:pick,teacher:me,ts:Date.now()};tmp[rec.sid]=rec;out.push(rec)}else{fail.push(s.name)}
  });
  flash={c:fail.length?"wa":"ok",t:out.length+" öğrenciye otomatik 2. toplantı tarihi atandı."+(fail.length?" Uygun gün bulunamayanlar ("+fmt(SEC_START)+" – "+fmt(SEC_END)+" aralığında): "+fail.join(", "):"")};
  if(out.length){
    var u={};out.forEach(function(o){u['meetings/'+o.sid]=o});
    database.ref().update(u).catch(function(){flash={c:"er",t:"Otomatik atama kaydedilemedi."};render()});
  }else render();

function membersFor(s){
  var all=Object.keys(MEM).map(function(k){return MEM[k]}),cl=function(m){return m.classes||[]};
  var by=function(r){return all.filter(function(m){return m.role===r&&cl(m).indexOf(s.cls)>=0})};
  var bsk=by("baskan");if(!bsk.length)bsk=all.filter(function(m){return m.role==="baskan"&&!cl(m).length});
  var rh=by("rehber").sort(function(a,b){return a.name.localeCompare(b.name,"tr")});
  var br=by("brans").sort(function(a,b){return(a.branch+a.name).localeCompare(b.branch+b.name,"tr")});
  return{bsk:bsk.slice(0,1),rh:rh,br:br};
}

  '</table>'+
  '<div class="cols"><div><h2>GÜNDEM MADDELERİ</h2>'+ag+'</div><div><h2>ALINAN KARARLAR</h2>'+kr+'</div></div>'+
  '<h2>BEP GELİŞTİRME BİRİMİ ÜYELERİ</h2>'+
  '<table class="kt"><tr><th>Görevi / Branşı</th><th>Adı Soyadı</th><th>İmzası</th></tr>'+
  P("Birim Başkanı (Müdür/Müdür Yrd.)","bsk")+P("Sınıf Öğretmeni / Sınıf Rehber Öğrt.","srh")+P("Rehber Öğretmen / Psikolojik Danışman","rh1")+
  P("Rehber Öğretmen / Psikolojik Danışman","rh2")+P("Özel Eğitim Öğretmeni (Varsa)","ozel")+P("Öğrenci Velisi (Anne/Baba)","anne")+
  dr+'</table>'+
  '<p class="nx"><b>Bir Sonraki Toplantı Tarihi:</b> '+fv(d,"nxt",ed)+'</p>';
}

function formView(){
  var b=baseOf(view), n=numOf(view);
  var s=S.filter(function(x){return x.id===b})[0];
  var d=Object.assign(defs(s,n),FORMS[view]||{});
  var fl=flash?'<div class="banner '+flash.c+'">'+esc(flash.t)+'</div>':"";
  app.innerHTML='<style>'+FORM_CSS+'</style>'+
  '<div class="card top"><div><h1>Form Düzenleme: '+esc(s.name)+'</h1><div class="sub">'+n+'. Toplantı Formu</div></div>'+
  '<div class="cell"><button onclick="saveForm()">Değişiklikleri Kaydet</button> <button onclick="window.print()">Yazdır / PDF Yap</button> <button class="g" onclick="closeForm()">Geri Dön</button></div></div>'+
  fl+
  '<div class="paper">'+formMarkup(s,n,d,true)+'</div>'+
  '<div class="printonly"><div class="paper">'+formMarkup(s,n,d,false)+'</div></div>';
  document.querySelectorAll(".paper textarea").forEach(autosize);
}

function autosize(t){t.style.height="auto";t.style.height=t.scrollHeight+"px"}
function hashKey(){var m=/^#form-(s\d+)-([123])$/.exec(location.hash);return m?(m[2]==="1"?m[1]:m[1]+"_"+m[2]):null}
function openForm(key){view=key;flash=null;location.hash="form-"+baseOf(key)+"-"+numOf(key);render()}
function closeForm(){view=null;flash=null;history.replaceState(null,"",location.pathname+location.search);render()}

window.addEventListener("hashchange",function(){if(!me)return;var k=hashKey();if(k&&!meetings[k])k=null;if(k!==view){view=k;flash=null;render()}});
document.addEventListener("input",function(e){
  var t=e.target,k=t.dataset&&t.dataset.k;if(!view||!k)return;
  (FORMS[view]=FORMS[view]||{})[k]=t.value;
  if(t.tagName==="TEXTAREA")autosize(t);
});

function saveForm(){
  database.ref('forms/'+view).set(FORMS[view]||{})
  .then(function(){flash={c:"ok",t:"Form buluta başarıyla kaydedildi."};formView()})
  .catch(function(){flash={c:"er",t:"Form kaydedilirken hata oluştu."};formView()});
}

// ---- ANA GÖRÜNÜM ----
function setFilter(v){filterT=v;flash=null;render()}
function switchTab(n){tab=n;flash=null;render()}

function mainView(){
  var el=S.filter(function(s){return(admin||s.t===me)&&(!filterT||s.t===filterT)});
  var counts={};for(var k in meetings){if(meetings[k])counts[meetings[k].date]=(counts[meetings[k].date]||0)+1}
  var fl=flash?'<div class="banner '+flash.c+'">'+esc(flash.t)+'</div>':"";
  var h='<div class="card top"><div><h1>BEP Birim Toplantı Takvimi</h1><div class="sub">Kullanıcı: '+esc(me)+(admin?" (Yönetici)":"")+'</div></div>'+
  '<button class="g" onclick="logout()">Çıkış Yap</button></div>'+fl+
  '<div class="card">'+
  (admin?'<label style="margin-top:0">Öğretmen Filtresi</label><select onchange="setFilter(this.value)"><option value="">Tümü</option>'+
    TEACHERS.map(function(t){return'<option value="'+esc(t)+'"'+(filterT===t?" selected":"")+'>'+esc(t)+'</option>'}).join("")+'</select>':'')+'<div class="bar">'+
  '<button onclick="autoAssign2()">2. Toplantıları Otomatik Ata</button>'+
  '<button class="g'+(tab===1?" on":"")+'" onclick="switchTab(1)">Öğrenci Listesi</button>'+
  '<button class="g'+(tab===2?" on":"")+'" onclick="switchTab(2)">Takvim Yoğunluğu</button>'+
  (admin?'<button class="g'+(tab===3?" on":"")+'" onclick="switchTab(3)">BEP Birimi</button>':'')+
  (tab===1?'<button class="g" onclick="window.print()">Yazdır</button>':'')+
  '</div></div><div class="card tw">';
  if(tab===1){
    h+='<table><tr><th>#</th><th>Grup</th><th>Öğrenci</th><th>Sınıf/No</th><th>Öğretmen</th><th>1. Toplantı</th><th>2. Toplantı</th><th>3. Toplantı</th></tr>'+
    el.map(function(s,i){
      return '<tr><td class="sm">'+(i+1)+'</td><td>'+esc(s.grp)+'</td><td><b>'+esc(s.name)+'</b>'+(s.st?'<div class="sm">'+esc(s.st)+'</div>':'')+(s.dx?'<div class="sm">'+esc(s.dx)+'</div>':'')+'</td><td>'+esc(s.cls)+' / '+esc(s.no)+'</td><td>'+esc(s.t)+'</td>'+
        dateCell(s.id,meetings[s.id],true)+dateCell(s.id+"_2",meetings[s.id+"_2"],!!meetings[s.id])+cell3(s)+'</tr>';
    }).join("")+'</table>';
  }else if(tab===3&&admin){
    h+=memView();
  }else{
    h+='<table style="min-width:0"><tr><th>Tarih</th><th>Toplantı</th></tr>';
    for(var d="2026-09-01";d<=LAST_DAY;d=addDays(d,1)){
      if(!okDay(d))continue;
      var n=counts[d]||0,c=n>=MAX_PER_DAY?"er":n>0?"ok":"";
      h+='<tr><td>'+fmt(d)+'</td><td><span class="tag '+c+'">'+n+' / '+MAX_PER_DAY+' Toplantı</span></td></tr>';
    }
    h+='</table>';
  }
  h+='</div>';
  // yazdırma çıktısı
  var pr=[];el.forEach(function(s){[s.id,s.id+"_2",s.id+"_3"].forEach(function(k,i){if(meetings[k])pr.push({d:meetings[k].date,s:s,n:i+1})})});
  pr.sort(function(a,b){return a.d<b.d?-1:a.d>b.d?1:0});
  h+='<div class="printonly"><h2>BEP Birim Toplantı Takvimi</h2><p>'+(filterT?esc(filterT):admin?"Tüm öğretmenler":esc(me))+'</p>'+
  '<table class="pt"><tr><th>Tarih</th><th>Toplantı</th><th>Öğrenci</th><th>Sınıf</th><th>Öğretmen</th></tr>'+
  pr.map(function(x){return'<tr><td>'+fmt(x.d)+'</td><td>'+x.n+'. toplantı</td><td>'+esc(x.s.name)+'</td><td>'+esc(x.s.cls)+'</td><td>'+esc(x.s.t)+'</td></tr>'}).join("")+'</table></div>';
  app.innerHTML=h;
}

function lim(sid){
  var b=baseOf(sid),n=numOf(sid),m1=meetings[b],m2=meetings[b+"_2"];
  if(n===2&&m1){var mn=addDays(m1.date,MIN_GAP);if(mn<=SEC_END)return{min:mn>SEC_START?mn:SEC_START,max:SEC_END};return{min:SEC_START,max:SEC_END}}
  if(n===3&&m2)return{min:addMonth(m2.date),max:LAST_DAY};
  return{min:"2026-09-01",max:LAST_DAY};
}

function dateInner(sid,m,enabled){
  var d=m?m.date:"",err=rowErr[sid],l=lim(sid);
  return '<div class="cell">'+
  '<input type="date" value="'+d+'" min="'+l.min+'" max="'+l.max+'"'+(enabled?'':' disabled')+' onchange="if(this.value)this.nextElementSibling.style.display=\'\'">'+
  '<button style="display:none" onclick="var v=this.previousElementSibling.value;if(v)save(\''+sid+'\',v)">Kaydet</button>'+
  (d?'<button class="g" onclick="openForm(\''+sid+'\')">Form</button><button class="g" onclick="clearDate(\''+sid+'\')">Sil</button>':'')+
  '</div>'+(err?'<div class="msg">'+esc(err)+'</div>':'');
}

function dateCell(sid,m,enabled){
  return '<td class="'+(rowErr[sid]?"bad":"")+'">'+dateInner(sid,m,enabled)+'</td>';
}

function cell3(s){
  var on=!!NEED3[s.id],id=s.id+"_3";
  return '<td class="'+(rowErr[id]?"bad":"")+'"><label style="display:flex;gap:6px;align-items:center;margin:0 0 6px;color:var(--tx)">'+
  '<input type="checkbox" style="width:auto"'+(on?' checked':'')+' onchange="toggle3(\''+s.id+'\',this.checked)">3. toplantı gerekli</label>'+
  (on?dateInner(id,meetings[id],!!meetings[s.id+"_2"]):'')+'</td>';
}

var ROLES={baskan:"Birim Başkanı (Müdür/Müdür Yrd.)",rehber:"Rehber Öğretmen / Psikolojik Danışman",brans:"Branş Öğretmeni"};

function memView(){
  var e=editM&&MEM[editM]?MEM[editM]:{name:"",role:"rehber",branch:"",classes:[]},cl=e.classes||[];
  var h='<h1 style="font-size:15px">'+(editM?"Üyeyi Düzenle":"Yeni Üye Ekle")+'</h1>'+
  '<div class="sub">Burada tanımlanan üyeler, öğrencinin sınıfına göre tutanak formuna otomatik yerleşir.</div>'+
  '<div id="mf"><label style="margin-top:0">Ad Soyad</label><input id="mn" value="'+esc(e.name)+'">'+
  '<label>Görevi</label><select id="mr" onchange="roleCh()">'+Object.keys(ROLES).map(function(k){return'<option value="'+k+'"'+(e.role===k?" selected":"")+'>'+ROLES[k]+'</option>'}).join("")+'</select>'+
  '<div id="mbw" style="display:'+(e.role==="brans"?"block":"none")+'"><label>Branşı (ör. Matematik)</label><input id="mb" value="'+esc(e.branch||"")+'"></div>'+
  '<label>Girdiği sınıflar <span class="sm">(Birim başkanında boş bırakılırsa tüm sınıflar için geçerli olur)</span></label>'+
  '<div class="chips">'+CLASSES.map(function(c){return'<label class="chip"><input type="checkbox" value="'+esc(c)+'"'+(cl.indexOf(c)>=0?" checked":"")+'>'+esc(c)+'</label>'}).join("")+'</div>'+
  '<div class="bar" style="margin-top:12px"><button onclick="saveMember()">'+(editM?"Güncelle":"Ekle")+'</button>'+
  '<button class="g" onclick="selAll(true)">Tümünü Seç</button><button class="g" onclick="selAll(false)">Temizle</button>'+
  (editM?'<button class="g" onclick="editM=null;render()">Vazgeç</button>':'')+'</div></div>'+
  '<h1 style="font-size:15px;margin-top:24px">Tanımlı Üyeler</h1>';
  var ids=Object.keys(MEM).sort(function(a,b){var x=MEM[a],y=MEM[b];return(x.role+(x.branch||"")+x.name).localeCompare(y.role+(y.branch||"")+y.name,"tr")});
  if(!ids.length)return h+'<div class="sub">Henüz üye eklenmedi.</div>';
  return h+'<table><tr><th>Ad Soyad</th><th>Görevi</th><th>Sınıflar</th><th></th></tr>'+ids.map(function(id){
    var m=MEM[id],c=m.classes||[];
    return'<tr><td><b>'+esc(m.name)+'</b></td><td>'+esc(ROLES[m.role]||"")+(m.branch?' <span class="sm">— '+esc(m.branch)+'</span>':'')+'</td><td class="sm">'+(c.length?esc(c.join(", ")):(m.role==="baskan"?"Tümü":"—"))+'</td>'+
    '<td><div class="cell"><button class="g" onclick="editMember(\''+id+'\')">Düzenle</button><button class="g" onclick="delMember(\''+id+'\')">Sil</button></div></td></tr>';
  }).join("")+'</table>';
}
function roleCh(){document.getElementById("mbw").style.display=document.getElementById("mr").value==="brans"?"block":"none"}
function selAll(on){document.querySelectorAll("#mf .chip input").forEach(function(c){c.checked=on})}
function editMember(id){editM=id;flash=null;render()}
function delMember(id){if(confirm("Bu üye silinsin mi?"))database.ref("members/"+id).remove()}
function saveMember(){
  var name=document.getElementById("mn").value.trim(),role=document.getElementById("mr").value,br=document.getElementById("mb").value.trim();
  var cls=[].slice.call(document.querySelectorAll("#mf .chip input:checked")).map(function(c){return c.value});
  if(!name){alert("Lütfen ad soyad girin.");return}
  if(role==="brans"&&!br){alert("Branş öğretmeni için branş girin.");return}
  var id=editM||database.ref("members").push().key;
  if(document.activeElement)document.activeElement.blur();
  editM=null;flash={c:"ok",t:name+" kaydedildi."};
  database.ref("members/"+id).set({name:name,role:role,branch:role==="brans"?br:"",classes:cls,ts:Date.now()})
  .catch(function(){flash={c:"er",t:"Üye kaydedilemedi."};render()});
}

function loginView(){
  app.innerHTML='<div class="card login"><h1>BEP Birim Toplantı Takvimi</h1><div class="sub">Giriş</div>'+
  '<label>Kimliğiniz</label>'+
  '<select id="lt"><option value="__admin">Yönetici (tüm öğrenciler)</option>'+
  TEACHERS.map(function(t){return'<option value="'+esc(t)+'">'+esc(t)+'</option>'}).join("")+'</select>'+
  '<label>Giriş Kodu</label><input type="password" id="lc" placeholder="Giriş kodu">'+
  '<div id="le" class="msg" style="font-size:13px;margin:6px 0"></div>'+
  '<button id="lb" style="width:100%">Giriş Yap</button></div>';
  document.getElementById("lb").onclick=go;
  document.getElementById("lc").onkeydown=function(e){if(e.key==="Enter")go()};
}

function go(){
  var t=document.getElementById("lt").value,c=document.getElementById("lc").value,e=document.getElementById("le");
  if(t==="__admin"?c!==ADMIN_CODE:c!==TEACHER_CODE){e.textContent="Giriş kodu hatalı.";return}
  admin=t==="__admin";me=admin?"Yönetici":t;flash=null;tab=1;filterT=admin?"":t;
  var k=hashKey();view=k&&meetings[k]?k:null;
  render();
}

function logout(){me=null;admin=false;view=null;flash=null;filterT="";tab=1;editM=null;render()}

function render(){if(!me)loginView();else if(view)formView();else mainView()}
render();
</script>
</body>
</html>
