var S=[],TEACHERS=[],CLASSES=[],STU={},seeding=false;
function rebuild(){
  S=Object.keys(STU).map(function(id){var o=STU[id]||{};return{id:id,grp:o.grp||"",name:o.name||"",cls:o.cls||"",no:String(o.no||""),t:o.t||"",st:o.st||"",dx:o.dx||""}})
    .sort(function(a,b){return(+a.id.slice(1))-(+b.id.slice(1))});
  TEACHERS=[];S.forEach(function(x){if(x.t&&TEACHERS.indexOf(x.t)<0)TEACHERS.push(x.t)});TEACHERS.sort(function(a,b){return a.localeCompare(b,"tr")});
  CLASSES=[];S.forEach(function(x){if(x.cls&&CLASSES.indexOf(x.cls)<0)CLASSES.push(x.cls)});CLASSES.sort(function(a,b){return a.localeCompare(b,"tr",{numeric:true})});
}

      else{STU={};rebuild();softRender()}
    });
    return;
  }
  STU=v||{};rebuild();softRender();
});
function softRender(){var ae=document.activeElement,mf=document.getElementById('mf')||document.getElementById('sf');if(!view && !IMP && !(ae && (ae.type==='date'||ae.type==='time')) && !(mf && mf.contains(ae))) render()}   // takvim açıkken yeniden çizme

  if(!view){ FORMS = snap.val() || {}; softRender(); }   // form açıkken yazılan metni ezme

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function today(){return iso(new Date())}
function fmt(d){if(!d) return ""; var x=new Date(d+"T12:00:00");return x.toLocaleDateString("tr-TR",{day:"2-digit",month:"2-digit",year:"numeric"})+" "+x.toLocaleDateString("tr-TR",{weekday:"long"})}
function dmy(d,sep){return d?d.split("-").reverse().join(sep||"."):".../.../...."}
function countOn(d,except){var n=0;for(var k in meetings){if(meetings[k]&&meetings[k].date===d&&k!==except)n++}return n}
function okDay(d){var w=new Date(d+"T12:00:00").getDay();return!(w===6||w===0||HOL[d])}
function baseOf(k){return k.replace(/_[23]$/,'')}
function numOf(k){var m=/_([23])$/.exec(k);return m?+m[1]:1}
function addMonth(d){var x=new Date(d+"T12:00:00"),g=x.getDate();x.setMonth(x.getMonth()+1);if(x.getDate()!==g)x.setDate(0);return iso(x)}
function addDays(d,n){var x=new Date(d+"T12:00:00");x.setDate(x.getDate()+n);return iso(x)}

function check(d,sid){
  if(!d) return null;
  var w=new Date(d+"T12:00:00").getDay();
  if(d < "2026-09-01" || d > LAST_DAY) return "Seçilen tarih eğitim öğretim yılı dışında ("+fmt(LAST_DAY)+" son gün).";
  if(w===6||w===0) return fmt(d)+" hafta sonuna denk geliyor. Lütfen bir hafta içi gün seçin.";
  if(HOL[d]) return fmt(d)+" tatil günü ("+HOL[d]+"). Lütfen başka bir gün seçin.";
  if(countOn(d,sid)>=MAX_PER_DAY) return fmt(d)+" günü için "+MAX_PER_DAY+" toplantı kontenjanı dolu. Lütfen başka bir gün seçin.";
  return null;
}

function save(sid,d,tm){
  tm=tm||'12:20';
  if(!d){clearDate(sid);return}
  var base=baseOf(sid),n=numOf(sid),m1=meetings[base],m2=meetings[base+"_2"];
  var s=S.filter(function(x){return x.id===base})[0];
  var err=check(d,sid);
  if(!err&&n===2){
    if(!m1)err="Önce 1. toplantı tarihini girin.";
    else if(d<SEC_START||d>SEC_END)err="2. toplantı, 2. dönem başlangıcından ("+fmt(SEC_START)+") itibaren bir ay içinde, en geç "+fmt(SEC_END)+" tarihine kadar yapılmalı.";
    else if(d<addDays(m1.date,MIN_GAP))err="2. toplantı, 1. toplantıdan en az "+MIN_GAP+" gün sonra olmalı.";
  }
  if(!err&&n===3){
    if(!m2)err="Önce 2. toplantı tarihini girin.";
    else if(d<addMonth(m2.date))err="3. toplantı, 2. toplantıdan en az 1 ay sonra ("+fmt(addMonth(m2.date))+" veya sonrası) olmalı.";
  }
  if(err){rowErr[sid]=err;flash={c:"er",t:s.name+": "+err};render();return}
  delete rowErr[sid];
  flash={c:"ok",t:s.name+" için BEP "+n+". birim toplantısı "+fmt(d)+" olarak kaydedildi (saat "+tm+")."};
  if(FORMS[sid])delete FORMS[sid].saat;database.ref('forms/'+sid+'/saat').remove();   // saat artık listeden gelir
  database.ref('meetings/'+sid).set({sid:sid,date:d,time:tm,teacher:me,ts:Date.now(),done:(meetings[sid]&&meetings[sid].done)||null})
  .catch(function(){flash={c:"er",t:"Bulut veri tabanına kayıt yapılamadı."};render()});
}

function clearDate(sid){
  delete rowErr[sid];flash=null;
  var b=baseOf(sid),n=numOf(sid),u={};
  u['meetings/'+sid]=null;
  if(n===1){u['meetings/'+b+'_2']=null;u['meetings/'+b+'_3']=null;u['need3/'+b]=null}
  if(n===2)u['meetings/'+b+'_3']=null;
  database.ref().update(u);
}

function toggle3(id,on){
  flash=null;delete rowErr[id+"_3"];
  var u={};u['need3/'+id]=on?true:null;
  if(!on)u['meetings/'+id+'_3']=null;
  database.ref().update(u);
}

function autoAssign2(){
  var need=S.filter(function(s){return(admin||s.t===me)&&meetings[s.id]&&!meetings[s.id+"_2"]&&!s.st});
  need.sort(function(a,b){var x=meetings[a.id].date,y=meetings[b.id].date;return x<y?-1:x>y?1:(+a.no)-(+b.no)});
  var miss=S.filter(function(s){return(admin||s.t===me)&&!meetings[s.id]&&!s.st}).length;
  if(!need.length){flash={c:"wa",t:"Otomatik atanacak öğrenci yok."+(miss?" 1. toplantı tarihi girilmemiş "+miss+" öğrenci var; önce 1. toplantıyı girin.":"")};render();return}
  var win=[];for(var d=SEC_START;d<=SEC_END;d=addDays(d,1))if(okDay(d)&&d>=today())win.push(d);
  var tmp=Object.assign({}, meetings);

  var soft=Math.max(1,Math.ceil(need.length/Math.max(win.length,1))),out=[],fail=[];
  need.forEach(function(s,i){

  });

    database.ref().update(u).catch(function(){flash={c:"er",t:"Otomatik atama kaydedilemedi."};render()});
  }else render();
}

function membersFor(s){
  var all=Object.keys(MEM).map(function(k){return MEM[k]}),cl=function(m){return m.classes||[]};
  var by=function(r){return all.filter(function(m){return m.role===r&&cl(m).indexOf(s.cls)>=0})};
  var bsk=by("baskan");if(!bsk.length)bsk=all.filter(function(m){return m.role==="baskan"&&!cl(m).length});
  var rh=by("rehber").sort(function(a,b){return a.name.localeCompare(b.name,"tr")});
  var br=by("brans").sort(function(a,b){return(a.branch+a.name).localeCompare(b.branch+b.name,"tr")});
  return{bsk:bsk.slice(0,1),rh:rh,br:br};
}
function fsel(d,k,ed,role){

  if(!ed)return '<span class="v">'+esc(v)+'</span>';

    .sort(function(a,b){return((a.branch||"")+a.name).localeCompare((b.branch||"")+b.name,"tr")});
  var found=false,o=L.map(function(m){var lb=m.name+(m.branch?' ('+m.branch+')':'');if(lb===v)found=true;return '<option value="'+esc(lb)+'"'+(lb===v?' selected':'')+'>'+esc(lb)+'</option>'}).join('');
  if(v&&!found)o+='<option value="'+esc(v)+'" selected>'+esc(v)+'</option>';
  return '<select data-k="'+k+'"><option value=""></option>'+o+'</select>';
}

function parseStudentPages(pages){
  var out=[],grp="";
  function txt(its){var t="",pe=null;its.slice().sort(function(a,b){return a.x-b.x}).forEach(function(i){if(pe!==null&&i.x-pe>1.2&&!/\s$/.test(t)&&!/^\s/.test(i.s))t+=" ";t+=i.s;pe=i.x+i.w});return t.replace(/\s+/g," ").trim()}
  function cluster(its,tol){var L=[];its.slice().sort(function(a,b){return b.y-a.y}).forEach(function(i){var l=L[L.length-1];if(l&&Math.abs(l.y-i.y)<=tol)l.items.push(i);else L.push({y:i.y,items:[i]})});return L}
  var KEYS=[["no",/^#/],["name",/^Ad/],["cls",/^S[ıi]n/],["num",/^Numara/],["t",/^Ö.retmen/],["destek",/^Destek/],["dx",/^Yeter/],["rapor",/^Rapor/],["st",/^Devam/]];
  pages.forEach(function(items){
    items=items.filter(function(i){return i.s.trim()});
    var ev=[],isEv=new Set();
    cluster(items,1.5).forEach(function(l){
      var t=txt(l.items),sorted=l.items.slice().sort(function(a,b){return a.x-b.x});
      if(/Numara/.test(t)&&sorted.some(function(i){return i.s.trim()==="#"})){
        var ch=[],pe=null;sorted.forEach(function(i){if(pe===null||i.x-pe>4)ch.push({x:i.x,t:""});ch[ch.length-1].t+=i.s;pe=i.x+i.w});
        var cols=[];ch.forEach(function(c){KEYS.forEach(function(k){if(k[1].test(c.t.trim()))cols.push({x:c.x,k:k[0]})})});
        ev.push({y:l.y,type:"h",cols:cols});l.items.forEach(function(i){isEv.add(i)});
      }else{
        var m=/^(.+?)\s+(?:Sınıfı\s+)?\((\d+)\)\s*[—–-]/.exec(t);
        if(m){ev.push({y:l.y,type:"g",g:m[1].trim()});l.items.forEach(function(i){isEv.add(i)})}
      }
    });
    ev.sort(function(a,b){return b.y-a.y});
    var regions=[],cur=null,curG=grp;
    ev.forEach(function(e){if(e.type==="g"){curG=e.g;cur=null}else{cur={y:e.y,cols:e.cols,g:curG,items:[]};regions.push(cur)}});
    grp=curG;
    // öğeleri bölgelere dağıt (başlık/grup satırlarından sonra gelenler)
    items.forEach(function(i){
      if(isEv.has(i))return;
      var r=null,last=null;ev.forEach(function(e){if(e.y>i.y+1.5)last=e});
      if(last&&last.type==="h")regions.forEach(function(x){if(x.y===last.y)r=x});
      if(r)r.items.push(i);
    });
    regions.forEach(function(r){
      var cols=r.cols;if(!cols.length)return;
      function colOf(x){var k=null;cols.forEach(function(c){if(c.x<=x+3)k=c.k});return k}
      var centers=r.items.filter(function(i){return colOf(i.x)==="no"&&/^\d+$/.test(i.s.trim())}).map(function(i){return i.y});
      if(!centers.length)return;
      centers.sort(function(a,b){return b-a});
      var rows=centers.map(function(){return{f:{}}}),byCol={};
      r.items.forEach(function(i){var k=colOf(i.x);if(k&&k!=="no")(byCol[k]=byCol[k]||[]).push(i)});
      Object.keys(byCol).forEach(function(k){   // satırlar dikey ortalı: her satır, merkezine en yakın ardışık satır bloğunu alır
        var L=cluster(byCol[k],1.5),R=centers.length,p=0;
        for(var ri=0;ri<R&&p<L.length;ri++){
          var blk=[L[p]],sum=L[p].y;p++;
          while(p<L.length&&(L.length-p)>(R-ri-1)){
            var nm=(sum+L[p].y)/(blk.length+1);
            if(Math.abs(nm-centers[ri])<Math.abs(sum/blk.length-centers[ri])){blk.push(L[p]);sum+=L[p].y;p++}else break;
          }
          rows[ri].f[k]=blk.map(function(l){return txt(l.items)}).join(" ").replace(/\s+/g," ").trim();
        }
      });
      rows.forEach(function(w){
        var f=w.f;
        var st=(f.st||"").replace(/^[—–✓\s]+/,"");if(st==="aktif")st="";
        if(f.name&&f.num)out.push({grp:r.g,name:f.name,cls:f.cls||"",no:f.num,t:f.t||"",st:st,dx:f.dx||""});
      });
    });
  });
  return out;
}

function saveStu(){
  var g=function(i){return document.getElementById(i).value.trim()},up=function(v){return v.toLocaleUpperCase("tr")};
  var rec={name:up(g("sn")),no:g("sno"),cls:g("sc"),grp:g("sg"),t:up(g("stt")),st:g("sst"),dx:g("sd")};
  if(!rec.name||!rec.no){alert("Ad soyad ve okul numarası zorunlu.");return}
  if(S.some(function(x){return x.no===rec.no&&x.id!==editS})&&!confirm("Bu okul numarası başka bir öğrencide var. Yine de kaydedilsin mi?"))return;
  var id=editS||("s"+(maxNum()+1)),u={'meta/seeded':true};
  Object.keys(rec).forEach(function(k){u['students/'+id+'/'+k]=rec[k]});
  if(document.activeElement)document.activeElement.blur();
  editS=null;flash={c:"ok",t:rec.name+" kaydedildi."};
  database.ref().update(u).catch(function(){flash={c:"er",t:"Öğrenci kaydedilemedi."};render()});
}

function loadPdfJs(){return new Promise(function(res,rej){
  if(window.pdfjsLib)return res(window.pdfjsLib);
  var sc=document.createElement("script");sc.src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
  sc.onload=function(){pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";res(window.pdfjsLib)};
  sc.onerror=function(){rej(new Error("PDF kütüphanesi yüklenemedi (internet bağlantısını kontrol edin)"))};
  document.head.appendChild(sc)})}
function readPdf(inp){
  var f=inp.files[0];if(!f)return;
  flash={c:"wa",t:"PDF okunuyor…"};render();
  loadPdfJs().then(function(lib){return f.arrayBuffer().then(function(b){return lib.getDocument({data:new Uint8Array(b)}).promise})}).then(function(pdf){
    var ps=[];for(var i=1;i<=pdf.numPages;i++)ps.push(pdf.getPage(i).then(function(p){return p.getTextContent()}).then(function(tc){return tc.items.map(function(x){return{s:x.str,x:x.transform[4],y:x.transform[5],w:x.width}})}));
    return Promise.all(ps)}).then(function(pages){
    var list=parseStudentPages(pages);
    if(!list.length){flash={c:"er",t:"PDF’de öğrenci tablosu bulunamadı. “Özel Durumlu Öğrenci Listesi” biçimi bekleniyor."};render();return}
    IMP=diffImp(list);flash=null;render();
  }).catch(function(e){flash={c:"er",t:"PDF okunamadı: "+e.message};render()});
}
function diffImp(list){
  var byNo={},seen={},nw=[],ch=[],F=[["grp","Grup"],["name","Ad"],["cls","Sınıf"],["t","Öğretmen"],["st","Devamsızlık"],["dx","Tanı"]];
  S.forEach(function(x){byNo[x.no]=x});
  list.forEach(function(im){
    var c=byNo[im.no];if(!c){nw.push(im);return}
    seen[c.id]=1;var d=[];
    F.forEach(function(f){if((c[f[0]]||"")!==(im[f[0]]||""))d.push(f[1]+": "+(c[f[0]]||"—")+" → "+(im[f[0]]||"—"))});
    if(d.length)ch.push({id:c.id,im:im,d:d,name:c.name});
  });
  return{nw:nw,ch:ch,ms:S.filter(function(x){return!seen[x.id]})};
}
function impHtml(){
  var h='<h1 style="font-size:15px;margin-top:18px">Karşılaştırma Sonucu</h1>',n=0;
  function sec(t,arr,g,on,fn){if(!arr.length)return;n+=arr.length;h+='<div style="margin-top:12px"><b>'+t+' ('+arr.length+')</b>'+arr.map(function(x,i){return'<label class="ck"><input type="checkbox" data-g="'+g+'" data-i="'+i+'"'+(on?' checked':'')+'><span>'+fn(x)+'</span></label>'}).join('')+'</div>'}
  sec('Yeni eklenecek',IMP.nw,'nw',true,function(x){return'<b>'+esc(x.name)+'</b> — '+esc(x.cls)+' · No '+esc(x.no)+' · '+esc(x.t)+' <span class="sm">('+esc(x.grp)+')</span>'});
  sec('Bilgisi güncellenecek',IMP.ch,'ch',true,function(x){return'<b>'+esc(x.name)+'</b><div class="sm">'+x.d.map(function(z){return esc(z)}).join(' · ')+'</div>'});
  sec('PDF’de bulunmuyor — silinsin mi?',IMP.ms,'ms',false,function(x){return'<b>'+esc(x.name)+'</b> — '+esc(x.cls)+' · No '+esc(x.no)+' <span class="sm">(tüm toplantı kayıtları da silinir)</span>'});
  if(!n)return h+'<div class="sub">Fark yok: PDF ile mevcut liste aynı.</div><button class="g" onclick="IMP=null;render()">Kapat</button>';
  return h+'<div class="bar" style="margin-top:14px"><button onclick="applyImp()">Seçilenleri Uygula</button><button class="g" onclick="IMP=null;render()">Vazgeç</button></div>';
}
function applyImp(){
  var u={'meta/seeded':true},n=maxNum(),c={nw:0,ch:0,ms:0};
  function sel(g){return[].slice.call(document.querySelectorAll('#app input[data-g="'+g+'"]:checked')).map(function(x){return +x.dataset.i})}
  sel("nw").forEach(function(i){var r=IMP.nw[i],id="s"+(++n);Object.keys(r).forEach(function(k){u['students/'+id+'/'+k]=r[k]});c.nw++});
  sel("ch").forEach(function(i){var x=IMP.ch[i];Object.keys(x.im).forEach(function(k){u['students/'+x.id+'/'+k]=x.im[k]});c.ch++});
  sel("ms").forEach(function(i){delPaths(u,IMP.ms[i].id);c.ms++});
  database.ref().update(u).then(function(){IMP=null;flash={c:"ok",t:c.nw+" öğrenci eklendi, "+c.ch+" güncellendi, "+c.ms+" silindi."};render()})
  .catch(function(){flash={c:"er",t:"Değişiklikler kaydedilemedi."};render()});
}

var ROLES={baskan:"Birim Başkanı (Müdür/Müdür Yrd.)",rehber:"Rehber Öğretmen / Psikolojik Danışman",brans:"Branş Öğretmeni"};

function memView(){
  var e=editM&&MEM[editM]?MEM[editM]:{name:"",role:"rehber",branch:"",classes:[]},cl=e.classes||[];
  var h='<h1 style="font-size:15px">'+(editM?"Üyeyi Düzenle":"Yeni Üye Ekle")+'</h1>'+
  '<div class="sub">Burada tanımlanan üyeler, öğrencinin sınıfına göre tutanak formuna otomatik yerleşir.</div>'+
  '<div id="mf"><label style="margin-top:0">Ad Soyad</label><input id="mn" value="'+esc(e.name)+'">'+
  '<label>Görevi</label><div class="chips">'+Object.keys(ROLES).map(function(k){return'<label class="chip"><input type="radio" name="mr" value="'+k+'"'+(e.role===k?" checked":"")+' onchange="roleCh()">'+ROLES[k]+'</label>'}).join("")+'</div>'+
  '<div id="mbw" style="display:'+(e.role==="brans"?"block":"none")+'"><label>Branşı (ör. Matematik, Türkçe, Fen Bilimleri)</label><input id="mb" value="'+esc(e.branch||"")+'"></div>'+
  '<label>Girdiği sınıflar <span class="sm">(Birim başkanında boş bırakılırsa tüm sınıflar için geçerli olur)</span></label>'+
  '<div class="chips">'+CLASSES.map(function(c){return'<label class="chip"><input type="checkbox" value="'+esc(c)+'"'+(cl.indexOf(c)>=0?" checked":"")+'>'+esc(c)+'</label>'}).join("")+'</div>'+
  '<div class="bar" style="margin-top:12px"><button onclick="saveMember()">'+(editM?"Güncelle":"Ekle")+'</button>'+
  '<button class="g" onclick="selAll(true)">Tümünü Seç</button><button class="g" onclick="selAll(false)">Temizle</button>'+
  (editM?'<button class="g" onclick="editM=null;render()">Vazgeç</button>':'')+'</div></div>'+
  '<h1 style="font-size:15px;margin-top:24px">Tanımlı Üyeler</h1>';
  var ids=Object.keys(MEM).sort(function(a,b){var x=MEM[a],y=MEM[b];return(x.role+(x.branch||"")+x.name).localeCompare(y.role+(y.branch||"")+y.name,"tr")});
  if(!ids.length)return h+'<div class="sub">Henüz üye eklenmedi.</div>';
  return h+'<table><tr><th>Ad Soyad</th><th>Görevi</th><th>Sınıflar</th><th></th></tr>'+ids.map(function(id){
    var m=MEM[id],c=m.classes||[];
    return'<tr><td><b>'+esc(m.name)+'</b></td><td>'+esc(ROLES[m.role]||"")+(m.branch?' <span class="sm">— '+esc(m.branch)+'</span>':'')+'</td><td class="sm">'+(c.length?esc(c.join(", ")):(m.role==="baskan"?"Tümü":"—"))+'</td>'+
    '<td><div class="cell"><button class="g" onclick="editMember(\''+id+'\')">Düzenle</button><button class="g" onclick="delMember(\''+id+'\')">Sil</button></div></td></tr>';
  }).join("")+'</table>';
}
function curRole(){var r=document.querySelector("#mf input[name=mr]:checked");return r?r.value:"rehber"}
function roleCh(){document.getElementById("mbw").style.display=curRole()==="brans"?"block":"none"}
function selAll(on){document.querySelectorAll("#mf .chip input").forEach(function(c){c.checked=on})}
function editMember(id){editM=id;flash=null;render()}
function delMember(id){if(confirm("Bu üye silinsin mi?"))database.ref("members/"+id).remove()}
function saveMember(){
  var name=document.getElementById("mn").value.trim(),role=curRole(),br=document.getElementById("mb").value.trim();
  var cls=[].slice.call(document.querySelectorAll("#mf .chip input:checked")).map(function(c){return c.value});
  if(!name){alert("Lütfen ad soyad girin.");return}
  if(role==="brans"&&!br){alert("Branş öğretmeni için branş girin.");return}
  var id=editM||database.ref("members").push().key;
  if(document.activeElement)document.activeElement.blur();
  editM=null;flash={c:"ok",t:name+" kaydedildi."};
  database.ref("members/"+id).set({name:name,role:role,branch:role==="brans"?br:"",classes:cls,ts:Date.now()})
  .catch(function(){flash={c:"er",t:"Üye kaydedilemedi."};render()});
}

function loginView(){
  app.innerHTML='<div class="card login"><h1>BEP Birim Toplantı Takvimi</h1><div class="sub">Giriş</div>'+
  '<label>Kimliğiniz</label>'+
  '<select id="lt"><option value="__admin">Yönetici (tüm öğrenciler)</option>'+
  TEACHERS.map(function(t){return'<option value="'+esc(t)+'">'+esc(t)+'</option>'}).join("")+'</select>'+
  '<label>Giriş Kodu</label><input type="password" id="lc" placeholder="Giriş kodu">'+
  '<div id="le" class="msg" style="font-size:13px;margin:6px 0"></div>'+
  '<button id="lb" style="width:100%">Giriş Yap</button></div>';
  document.getElementById("lb").onclick=go;
  document.getElementById("lc").onkeydown=function(e){if(e.key==="Enter")go()};
}

function go(){
  var t=document.getElementById("lt").value,c=document.getElementById("lc").value,e=document.getElementById("le");
  if(t==="__admin"?c!==ADMIN_CODE:c!==TEACHER_CODE){e.textContent="Giriş kodu hatalı.";return}
  admin=t==="__admin";me=admin?"Yönetici":t;flash=null;tab=1;filterT=admin?"":t;
  var k=hashKey();view=k&&meetings[k]?k:null;
  render();
}

function logout(){me=null;admin=false;view=null;flash=null;filterT="";tab=1;editM=null;editS=null;IMP=null;render()}

function render(){if(!me)loginView();else if(view)formView();else mainView()}
render();
</script>
